name: Listen
options:
  bundleIdPrefix: com.listen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  ListenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ListenUITests
    dependencies:
      - target: Listen
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Listen

  ListenSmokeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ListenSmokeTests
    dependencies:
      - target: Listen
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

  Listen:
    type: application
    platform: iOS
    sources:
      - path: Listen
    resources:
      - path: Listen/Resources/Fonts
      - path: Listen/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.listen.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_ASSET_PATHS: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Listen/Info.plist
      properties:
        CFBundleDisplayName: listen
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - InterTight-Medium.ttf
          - InterTight-SemiBold.ttf
          - InterTight-Bold.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf

schemes:
  Listen:
    build:
      targets:
        Listen: all
        ListenSmokeTests: [test]
        ListenUITests: [test]
    test:
      targets:
        - ListenSmokeTests
        - ListenUITests
